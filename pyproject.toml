[project]
name = "sleepfake"
version = "1.2.1"
description = "Fake the time.sleep/asyncio.sleep function during tests."
authors = [
    { name = "Guillaume Pouyat", email = "guillaume.pouyat@protonmail.com" },
]
dependencies = [
    "freezegun>=1.4.0",
    "pytest>=8.0.2",
    "typing-extensions>=4.0; python_version < '3.11'",
]
readme = "README.md"
license = 'MIT'
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Testing :: Mocking',
]
requires-python = '>=3.10'

[build-system]
requires = ["uv_build>=0.11.2"]
build-backend = "uv_build"


[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"
# typeshed returns Any from loop.create_future() and getattr(); flagging every
# annotated assignment from those is noise, not safety.
unsound-assignment = "ignore"

[tool.ty.terminal]
error-on-warning = true


[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "E501",   # line length is handled by the formatter
    "CPY001", # no per-file copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1", "PLR2004", "EM101", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[project.entry-points.pytest11]
sleepfake = "sleepfake.plugin"


[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
timeout = 60
timeout_disable_debugger_detection = false

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[dependency-groups]
dev = [
    "prek>=0.5.3",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-randomly>=3.16.0",
    "pytest-sugar>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
